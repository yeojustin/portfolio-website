<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin Yeo - Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Segoe UI', 'San Francisco', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'popIn': 'popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            popIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="h-screen w-full font-sans flex items-center justify-center overflow-hidden select-none relative text-gray-200" style="background-image: url('assets/wallpaper2.jpg'); background-size: cover; background-position: center;">
  
  <div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-full text-center text-white/70 text-xs sm:text-sm drop-shadow-lg z-0 pointer-events-none tracking-wide">
    Built with Tailwind, Vanilla JS HTML and Antigravity ❤️
  </div>

  <main class="w-full h-full md:w-[90vw] md:h-[90vh] bg-[#1a1b1e]/70 backdrop-blur-2xl md:rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-white/20 flex flex-col overflow-hidden relative text-gray-200 z-10 transition-all">
    
    <!-- Title Bar -->
    <header class="h-12 flex items-center justify-between px-3 app-region-drag select-none">
      <div class="flex items-center gap-3">
        <svg class="w-4 h-4 text-blue-400" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
        <span class="text-xs font-medium text-gray-300">File Explorer</span>
      </div>
      <!-- Window Controls -->
      <div class="flex items-center gap-1 no-drag">
        <button class="w-11 h-8 flex items-center justify-center hover:bg-white/10 rounded-md transition-colors">
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <button class="w-11 h-8 flex items-center justify-center hover:bg-white/10 rounded-md transition-colors">
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v16H4z"></path></svg>
        </button>
        <button class="w-11 h-8 flex items-center justify-center hover:bg-red-500 hover:text-white rounded-md transition-colors group">
          <svg class="w-3 h-3 text-gray-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </header>

    <!-- Command / Address Bar -->
    <div class="h-12 border-b border-white/5 flex items-center px-4 gap-4 bg-white/[0.02]">
      <!-- Nav Buttons -->
      <div class="flex items-center gap-1 shrink-0">
        <button id="nav-back-btn" class="w-8 h-8 rounded-md hover:bg-white/10 flex items-center justify-center disabled:opacity-30 transition-colors" disabled>
          <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="nav-forward-btn" class="w-8 h-8 rounded-md hover:bg-white/10 flex items-center justify-center disabled:opacity-30 transition-colors" disabled>
          <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
        </button>
        <button id="nav-up-btn" class="w-8 h-8 rounded-md hover:bg-white/10 flex items-center justify-center disabled:opacity-30 transition-colors" disabled>
          <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
        </button>
      </div>

      <!-- Address Box -->
      <div class="flex-1 h-8 bg-black/20 border border-white/10 hover:border-white/20 focus-within:border-blue-500/50 focus-within:bg-black/40 rounded-md flex items-center px-3 cursor-text overflow-hidden transition-all shadow-inner">
        <span id="breadcrumb-container" class="text-gray-300 text-sm flex items-center gap-2 whitespace-nowrap">
          <span id="breadcrumb-home" class="hover:bg-white/10 px-1.5 py-0.5 rounded cursor-pointer transition-colors text-gray-400">This PC</span>
          <span class="text-gray-600">/</span>
          <span id="breadcrumb-user" class="hover:bg-white/10 px-1.5 py-0.5 rounded cursor-pointer transition-colors text-gray-400">Justin Yeo</span>
          <span class="text-gray-600">/</span>
          <span id="current-path" class="font-medium px-1 text-gray-200">Home</span>
        </span>
      </div>
      
      <!-- Search Box -->
      <div class="w-48 sm:w-64 h-8 bg-black/20 border border-white/10 hover:border-white/20 focus-within:border-blue-500/50 focus-within:bg-black/40 rounded-md flex items-center px-3 shadow-inner transition-all hidden sm:flex">
        <input type="text" id="search-input" placeholder="Search Justin Yeo" class="w-full h-full bg-transparent outline-none text-sm text-gray-200 placeholder-gray-500" />
        <svg class="w-4 h-4 text-gray-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>

    <!-- Body Layout -->
    <div class="flex flex-1 overflow-hidden">
      
      <!-- Sidebar -->
      <aside class="w-60 bg-white/[0.02] border-r border-white/5 flex flex-col pt-4 overflow-y-auto hidden md:flex shrink-0">
        <div class="px-5 mb-2 text-xs font-semibold text-gray-500">Home</div>
        <div class="px-3 space-y-0.5">
          <button class="nav-item w-full flex items-center gap-3 px-3 py-1.5 rounded-md border border-transparent hover:bg-white/5 text-sm text-gray-300 transition-colors" data-target="home">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home
          </button>
        </div>
        
        <div class="mt-6 mb-2 px-5 text-xs font-semibold text-gray-500">Folders</div>
        <div class="px-3 space-y-0.5">
          <button class="nav-item w-full flex items-center gap-3 px-3 py-1.5 rounded-md border border-transparent hover:bg-white/5 text-sm text-gray-300 transition-colors" data-target="projects">
            <span class="text-blue-400 text-base">📁</span> Projects
          </button>
          <!-- <button class="nav-item w-full flex items-center gap-3 px-3 py-1.5 rounded-md border border-transparent hover:bg-white/5 text-sm text-gray-300 transition-colors" data-target="profile">
            <span class="text-purple-400 text-base">📁</span> Profile
          </button> -->
          <button class="nav-item w-full flex items-center gap-3 px-3 py-1.5 rounded-md border border-transparent hover:bg-white/5 text-sm text-gray-300 transition-colors" data-target="contact">
            <span class="text-pink-400 text-base">📁</span> Contact
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <section class="flex-1 bg-black/20 flex flex-col relative overflow-hidden">
        <!-- View Toolbar -->
        <div class="h-10 border-b border-white/5 flex items-center px-6 gap-6 text-sm text-gray-400">
          <span id="breadcrumb-label" class="font-semibold text-gray-200">Home</span>
          <button class="flex items-center gap-2 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            Sort
          </button>
          <button class="flex items-center gap-2 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            View
          </button>
        </div>

        <div id="content-pane" class="flex-1 overflow-y-auto p-6 text-gray-200">
          <!-- Items render here -->
        </div>
      </section>
    </div>

    <!-- Status Bar -->
    <footer class="h-8 border-t border-white/5 bg-white/[0.02] flex items-center px-4 text-xs text-gray-400 justify-between select-none">
      <div class="flex items-center gap-4 h-full py-1">
        <span id="status-item-count">0 items</span>
        <span id="status-selected">0 items selected</span>
      </div>
      <div class="flex items-center gap-2">
        <button class="hover:bg-white/10 p-1 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg></button>
        <button class="bg-white/10 p-1 rounded"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></button>
      </div>
    </footer>
    
  </main>

  <!-- Modal for "opening" a file -->
  <div id="file-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-all duration-200">
    <div class="bg-[#1a1b1e] w-full max-w-2xl rounded-xl border border-white/10 shadow-2xl flex flex-col transform scale-95 transition-transform duration-200 overflow-hidden" id="file-modal-content">
      <div class="h-12 border-b border-white/5 bg-white/[0.02] flex items-center justify-between px-4 select-none">
        <div class="flex items-center gap-2">
          <span id="modal-icon" class="text-base drop-shadow-md">📄</span>
          <span id="modal-title" class="text-sm font-medium text-gray-200">File</span>
        </div>
        <button id="modal-close" class="w-8 h-8 flex items-center justify-center hover:bg-white/10 rounded-md text-gray-400 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 overflow-y-auto max-h-[70vh] text-gray-300" id="modal-body">
        <!-- Content here -->
      </div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./icons.js"></script>
  <script src="./script.js"></script>
</body>
</html>
